services:
  db:
    image: postgres:16
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  web:
    tty: true
    stdin_open: true
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LANG=pt_BR.UTF-8
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-password}
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3001 -b '0.0.0.0'"
    volumes:
      - .:/myapp
      - gems_cache:/usr/local/bundle
    ports:
      - "3001:3001"
    depends_on:
      - db
  worker:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LANG=pt_BR.UTF-8
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-password}
    command: bundle exec rails solid_queue:start
    volumes:
      - .:/myapp
      - gems_cache:/usr/local/bundle
    depends_on:
      - db

volumes:
  gems_cache:
